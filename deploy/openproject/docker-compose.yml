services:
  openproject:
    image: openproject/openproject:16
    container_name: openproject
    restart: unless-stopped
    ports:
      - "8080:80" # chỉ tới được qua Tailscale, Cloud Firewall không mở port này ra public
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST__NAME}
      OPENPROJECT_ADDITIONAL__HOST__NAMES: ${OPENPROJECT_ADDITIONAL_HOST_NAMES}
      OPENPROJECT_HTTPS: "false"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_MIN_THREADS: 4
      RAILS_MAX_THREADS: 16
      OPENPROJECT_FEATURE_DEPLOY_TARGETS_ACTIVE: "true"
    volumes:
      - openproject-assets:/var/openproject/assets

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - openproject

volumes:
  openproject-assets:
